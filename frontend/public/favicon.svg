<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>

    <!-- Vibrant YouTube Red / Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#FF4D4D" />
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333742" />
      <stop offset="100%" stop-color="#1A1C23" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Upward Bidding Arrow Shape -->
  <path 
    d="M 16 46 L 28 34 L 36 40 L 48 18" 
    fill="none" 
    stroke="url(#brandGrad)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Arrow Head Pointing Up-Right -->
  <path 
    d="M 38 18 H 48 V 28" 
    fill="none" 
    stroke="url(#brandGrad)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Play Triangle integrated into the arrow peak -->
  <path 
    d="M 23 20 L 33 26.5 L 23 33 Z" 
    fill="#FFFFFF" 
  />
</svg>
